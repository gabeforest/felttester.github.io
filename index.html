<!DOCTYPE html>

<html lang="en">

<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<meta name="description" content="Felt interactive experience"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style type="text/css">
/* Shopify-friendly page reset: transparent background and no page-level scrolling. */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 0;
    background: transparent;
}

/* Preserve the original 10px outer spacing. */
#wrapper {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin: 0 auto;
}

/*
   The original frame was 640px wide with 5px of internal padding.
   Keep that 5px spacing, but remove the colored frame, outline and rounding.
   On smaller Shopify columns, the game scales down proportionally.
*/
#border {
    width: 100%;
    max-width: 650px;
    height: auto;
    box-sizing: border-box;
    margin: 0 auto;
    padding: 5px;
    background: transparent;
    border: 0;
    border-radius: 0;
}

/* Keep the original 4:3 game proportions (640 x 480). */
#canvas {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    height: auto;
}

#MMFCanvas {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    box-shadow: none;
}

/* Preserve the uploaded custom font for form controls. */
@font-face {
    font-family: 'MyCustomFont';
    src: url('Compagnon-Bold.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
}

select, input, button {
    font-family: 'MyCustomFont', sans-serif !important;
}

/* Avoid accidental horizontal overflow inside narrow Shopify sections. */
*, *::before, *::after {
    box-sizing: border-box;
}
</style>

  <title>Felt</title>

	<script>
	   	// Detection of old browsers that do not support the canvas element
		// Falls back to a default page
	    if (!document.createElement("canvas").getContext)
	    {
			window.open("http://www.clickteam.com/html5-fallback", "_self");
		}
	</script>
	
  	<!-- EXTRASOURCES -->
	<!-- Loads the Javascript code...-->
  	<script src="src/Runtime.js"></script>
  	
  <script>

	// Detects if the html file is ran locally.
	// You can remove this code for the final version
	if (window.location.protocol == "file:")
	{
		document.write('<div id="bloctxt">');
		document.write('<h1>The application cannot be run...</h1>');
		document.write('<p>HTML browsers do not allow you to launch data files directly from the file system.<br>');
		document.write('A drag & drop of the html file on a web-browser window will not work, on any machine.<br>');
		document.write('Please use the Build & Run option (it opens a local web server) to run your application,<br>') 
		document.write('or upload your application folder to a remote web-server, and start it from there...</p>');
		document.write('</div>');
		throw new error("Cannot run application");
	}
  </script>
</head>

<!-- This is where we create the Canvas element that will contain the application...-->
<body>
    <div id="wrapper">
	    <div id="border">
		    <div id="canvas">
			    <canvas id="MMFCanvas" width="640" height="480">
				    <p>Your browser does not support Canvas.</p>
			    </canvas>   
		    </div>
	    </div>
    </div>  
    <script>
        // RUNTIMESTART
        // This is where the HTML5 runtime is actually started
	    window.addEventListener("load", windowLoaded, false);
	    function windowLoaded()
	    {
		    // Calls the runtime
		    // First parameter : name of the canvas element
		    // Second parameter : path to the cch file. Images and sounds must lay beside this file
		    new Runtime("MMFCanvas", "resources/Try1.cch");
	    }
        // RUNTIMESTARTEND
    </script>
 
</body>
</html>
